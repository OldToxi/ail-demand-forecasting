server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/forecast/ui {
    default_type application/json;
    alias /usr/share/nginx/api/forecast_ui.json;
    add_header Cache-Control "no-store";
  }
  location = /api/forecast/acl {
    default_type application/json;
    alias /usr/share/nginx/api/forecast_ui_ACL.json;
    add_header Cache-Control "no-store";
  }
  location = /api/forecast/bom {
    default_type application/json;
    alias /usr/share/nginx/api/bom_AIL.json;
    add_header Cache-Control "no-store";
  }
  location = /api/forecast/planner {
    default_type application/json;
    alias /usr/share/nginx/api/planner_adjustments.json;
    add_header Cache-Control "no-store";
  }
  location = /api/forecast/template {
    default_type text/csv;
    alias /usr/share/nginx/api/planner_adjustments_template.csv;
  }
  location = /api/health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
