# SBU registry - one entry per SBU/source. A new SBU is a new entry here (+ adapter if a new layout).
# All paths are repo-root relative. No model/UI code changes are needed to add an SBU.
sbus:
  - sbu_id: AIL
    name: Anwar Ispat Ltd.
    segment_code: STEEL
    min_history_months: 24
    top_accounts: {enabled: true, n: 20, channel: Corporate}
    sources:
      - name: Corporate
        adapter: tabular
        file: planning-app/data/raw/AIL-Total_Monthly-2023 to 2026.xlsx
        sheet: Data
        header_row: 1
        key_style: name
        filter: {column: Channel, value: Corporate}
        column_map:
          date: Date
          channel: Channel
          zone: Zone
          client: Dealer Name
          district: Districts
          manager: ZM Name
          am: TM/TO Name
          quantity: Sales In MT
          value: Sales values
          collection: Collection
      - name: Intercompany
        adapter: tabular
        file: planning-app/data/raw/AIL-Total_Monthly-2023 to 2026.xlsx
        sheet: Data
        header_row: 1
        key_style: name
        filter: {column: Channel, value: Intercompany}
        column_map:
          date: Date
          channel: Channel
          zone: Zone
          client: Dealer Name
          district: Districts
          manager: ZM Name
          am: TM/TO Name
          quantity: Sales In MT
          value: Sales values
          collection: Collection
      - name: Trade
        adapter: tabular
        file: planning-app/data/raw/AIL-Total_Monthly-2023 to 2026.xlsx
        sheet: Data
        header_row: 1
        key_style: name_plus_district
        filter: {column: Channel, value: Trade}
        column_map:
          date: Date
          channel: Channel
          zone: Zone
          client: Dealer Name
          district: Districts
          manager: ZM Name
          am: TM/TO Name
          quantity: Sales In MT
          value: Sales values
          collection: Collection

# Hierarchy: composed automatically; child series sum exactly to parents.
hierarchy:
  company_series: AIL|company
  external_series: AIL|sbu|external
  intercompany_channel: Intercompany
  external_channels: [Corporate, Trade]
  trade_zone_channel: Trade
  account_channel: Corporate
