# SBU registry - one entry per SBU/source. A new SBU is a new entry here (+ adapter if a new layout).
# All paths are repo-root relative. No model/UI code changes are needed to add an SBU.
sbus:
  - sbu_id: AIL
    name: Anwar Ispat Ltd.
    segment_code: STEEL
    min_history_months: 24
    top_accounts: {enabled: true, n: 20, channel: Corporate}
    sources:
      - name: Corporate
        adapter: tabular          # generic tabular adapter
        file: Data/AIL/AIL Corporate Monthly Data-2023-2026.xlsx
        sheet: Corporate
        header_row: 1
        key_style: name           # client_key = normalised name
        column_map:
          date: Date
          channel: Channel
          zone: Zone
          client: Clients
          manager: Manager Name
          am: AM Name
          quantity: MT
          value: S.values
          opening: OPB
          collection: Collection
          closing: CLB
      - name: Intercompany
        adapter: tabular
        file: Data/AIL/AIL-Intercompany_-2023_2026.xlsx
        sheet: Data
        header_row: 2             # title row precedes the header
        key_style: name
        column_map:
          date: Date
          channel: Channel
          zone: Zone
          client: Particulars
          quantity: MT
          value: Debit
          opening: Balance
          collection: Credit
          closing: Balance.1
      - name: Trade
        adapter: tabular
        file: Data/AIL/AIL-Trade_monthly-2023 to 26.xlsx
        sheet: Data
        header_row: 1
        key_style: name_plus_district   # client_key = base name + District
        column_map:
          date: Date
          channel: Channel
          zone: Zone
          client: Dealer Name
          manager: ZM Name
          am: TM/TO Name
          district: Districts
          quantity: Sales
          value: Sales values
          opening: Opening Balance
          collection: Collection
          closing: Closing Balance

# Hierarchy: composed automatically; child series sum exactly to parents.
hierarchy:
  company_series: AIL|company
  external_series: AIL|sbu|external
  intercompany_channel: Intercompany
  external_channels: [Corporate, Trade]
  trade_zone_channel: Trade
  account_channel: Corporate
