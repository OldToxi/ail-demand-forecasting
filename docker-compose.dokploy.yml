services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir 'Django==5.2.15' gunicorn
      && cd /app/backend
      && FORECAST_OUTPUTS_DIR=/app/data/outputs gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app/backend:ro
      - ./forecasting/templates:/app/forecasting/templates:ro
      - ./data/outputs/forecast/ui:/app/data/outputs/forecast/ui:ro
    expose:
      - "8000"
    restart: unless-stopped
  web:
    image: nginx:alpine
    volumes:
      - ./frontend/out:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped
