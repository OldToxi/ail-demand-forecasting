services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - FORECAST_OUTPUTS_DIR=/app/data/outputs
    expose:
      - "8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped
