services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      - FORECAST_OUTPUTS_DIR=/app/data/outputs
    expose: ["8000"]
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    environment:
      - API_DEST=http://api:8000
      - NEXT_TELEMETRY_DISABLED=1
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
